name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
      - 'fix*'
      - 'feat*'
      - 'feature*'
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            mcp/yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Checkout pinned Agent Skills specification
        uses: actions/checkout@v7
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .artifacts/agent-skills-spec

      - name: Install core dependencies
        run: yarn install --frozen-lockfile

      - name: Install MCP dependencies
        run: yarn mcp:install

      - name: Install pinned Agent Skills validator
        run: python -m pip install --disable-pip-version-check ./.artifacts/agent-skills-spec/skills-ref

      - name: Validate Agent Skills
        run: |
          for skill in \
            agent-skills/public/use-factorydrive \
            agent-skills/public/factorydrive-driver \
            agent-skills/maintenance/github-release \
            agent-skills/maintenance/spec-driven
          do
            skills-ref validate "$skill"
          done

      - name: Run Biome checks
        run: yarn lint:ci

      - name: Typecheck core
        run: yarn typecheck

      - name: Run core tests with coverage
        run: yarn test:coverage

      - name: Build core
        run: yarn build

      - name: Smoke test the production build
        run: node tests/dist-node-smoke.mjs

      - name: Test MCP protocol and documentation client
        run: yarn mcp:test

      - name: Build documentation and LLM artifacts
        run: yarn docs:build

      - name: Validate documentation and LLM artifacts
        run: yarn docs:check

      - name: Test repository scripts
        run: yarn test:scripts

      - name: Validate changelog sources
        run: yarn changelog:check

      - name: Audit core and MCP tarballs
        run: yarn package:check

      - name: Upload package audit
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-audit
          path: .artifacts/npm/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          slug: ${{ github.repository }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
